<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#grad)"/>

  <!-- Book -->
  <path d="M18 18
           C18 16,20 15,22 15
           H32
           V47
           H22
           C20 47,18 48,18 50
           Z"
        fill="#ffffff" opacity="0.95"/>

  <path d="M46 18
           C46 16,44 15,42 15
           H32
           V47
           H42
           C44 47,46 48,46 50
           Z"
        fill="#ffffff"/>

  <!-- Center Line -->
  <line x1="32" y1="15" x2="32" y2="47"
        stroke="#2563eb"
        stroke-width="1.5"/>

  <!-- Graduation Cap -->
  <polygon points="32,20 24,24 32,28 40,24"
           fill="#fbbf24"/>
  <line x1="40" y1="24" x2="40" y2="31"
        stroke="#fbbf24"
        stroke-width="2"/>
  <circle cx="40" cy="32.5" r="1.5"
